# Soak scenario for @map/stormsbeacon_voice ("Test: The Voice (relic)")
#
# Generated by `mission_runner --soak-init`. Edit freely; the comments below are
# what the generator could work out, not rules.
#
# Run it:   python -m cosmos_dev.tools.mission_soak <mission> stormsbeacon_voice --runs 3
#
# NOTE: a soak truncates mast.runtime.log in the mission directory, so the
# supervisor runs against an auto-managed copy. Do not point a run at a folder
# somebody is playing in the engine.

map: stormsbeacon_voice
seed: 7
seconds: 600

# Every option this map exposes, straight from its `Properties:` metadata.
# These are the ONLY setting keys it honors; anything else is silently inert.
settings:
  # PLAYER_COUNT:
  # DIFFICULTY:
  # Autoplay is the greedy combat bot, and it is what made --runs soaks
  # diverge. The pilot drives instead.
  AUTO_PLAY:
    enable: false

drive:
  accept_quests: all      # quest_mark_active - the Accept button's whole body
  goals: true             # drive each active quest's declared goal
  consoles: [helm, weapons, engineering, comms, science]
  # NOT the default of 3. At dwell 3 a console is swapped away in under a
  # sim-second, so `on change` watchers keyed to a one-second tick fire exactly
  # zero times - which is how a NameError in a watcher reached a real engine
  # session under a green headless run. Budget dwell x (5 + extras) / 3 seconds.
  dwell: 20

# QUEST CENSUS - 45 declared, 35 with a goal the pilot
# can drive directly. This is the CANDIDATE board: whether a mission actually
# grants a quest is a runtime decision, so treat it as an upper bound.
#
#   [ ---- ] goals/goal_light                   on_signal
#   [ ---- ] narrative/beacon_arc/ash_bottom    on_signal
#   [drive] narrative/beacon_arc/ash_dive      on_reach
#   [drive] narrative/beacon_arc/ash_go        on_reach
#   [ ---- ] narrative/beacon_arc/briefing      on_signal
#   [drive] narrative/beacon_arc/choir_dive    on_reach
#   [ ---- ] narrative/beacon_arc/choir_empty   on_signal
#   [drive] narrative/beacon_arc/choir_go      on_reach
#   [drive] narrative/beacon_arc/ep1_approach  on_reach
#   [drive] narrative/beacon_arc/ep1_bay       on_reach
#   [drive] narrative/beacon_arc/ep1_deep      on_reach
#   [drive] narrative/beacon_arc/ep1_go        on_reach
#   [drive] narrative/beacon_arc/ep1_inside    on_reach
#   [ ---- ] narrative/beacon_arc/ep1_scan      on_signal
#   [drive] narrative/beacon_arc/ep2_approach  on_reach
#   [drive] narrative/beacon_arc/ep2_drum      on_reach
#   [drive] narrative/beacon_arc/ep2_go        on_reach
#   [drive] narrative/beacon_arc/ep2_inside    on_reach
#   [ ---- ] narrative/beacon_arc/ep2_scan      on_signal
#   [drive] narrative/beacon_arc/ep3_approach  on_reach
#   [drive] narrative/beacon_arc/ep3_coil      on_reach
#   [drive] narrative/beacon_arc/ep3_false     on_reach
#   [drive] narrative/beacon_arc/ep3_go        on_reach
#   [ ---- ] narrative/beacon_arc/ep3_scan      on_signal
#   [drive] narrative/beacon_arc/ep4_approach  on_reach
#   [drive] narrative/beacon_arc/ep4_core      on_reach
#   [drive] narrative/beacon_arc/ep4_go        on_reach
#   [ ---- ] narrative/beacon_arc/ep4_scan      on_signal
#   [drive] narrative/beacon_arc/ep4_trench    on_reach
#   [drive] narrative/beacon_arc/ep4_yard      on_reach
#   [ ---- ] narrative/beacon_arc/get_cradle    on_signal
#   [drive] narrative/beacon_arc/origin_go     on_reach
#   [drive] narrative/beacon_arc/origin_scan   on_scan
#   [ ---- ] narrative/beacon_arc/sink_dive     on_signal
#   [drive] narrative/beacon_arc/sink_go       on_reach
#   [drive] narrative/beacon_arc/visit_emporium on_reach
#   [drive] relics/at_trench                   on_reach
#   [drive] relics/at_yard                     on_reach
#   [drive] relics/chart_place                 on_reach
#   [drive] relics/manifest_place              on_reach
#   [drive] relics/order_place                 on_reach
#   [drive] relics/rod_place                   on_reach
#   [drive] relics/slate_place                 on_reach
#   [drive] relics/traffic_place               on_reach
#   [drive] relics/votive_place                on_reach
#
# `----` means the goal is `on_signal`: completion comes from the mission's own
# route, and the pilot will NOT fire it - synthesizing that would test the
# harness rather than the mission. Those are reached, if at all, by the world
# sweeps and the comms walk, and are reported as NOT DRIVABLE rather than failed.

expect:
  # Deliberately empty. The ratchet in <name>.baseline.json is the real demand,
  # and it only ever holds what runs have actually achieved. Naming things here
  # that the harness has never reached makes the soak red every morning, and a
  # check people ignore is worse than no check.
  #
  # Build it instead:  ... --soak-bless   (a few runs; the baseline demands only
  # what EVERY blessed run reached, so blessing more runs relaxes flaky items).
  quests_complete: []
  routes_covered: []
  game_end: none

# The engine answers None for a data_set field nobody set; the mock answers a
# typed default. That gap is how two crashes shipped green.
strict_blob: true
